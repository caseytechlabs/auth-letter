<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jazz Residences — Authorization Letter Generator</title>

<!-- PWA / "Add to Home Screen" support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#152a4d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auth Letter">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="jazz.css">
<link rel="stylesheet" href="air.css">
</head>
<body>

<div class="app">

  <header class="top">
    <h1 id="pageTitle">Authorization Letter — Jazz Residences</h1>
    <div class="header-right">
      <span>Fill once, reuse owner signatures next time</span>
      <button class="btn-secondary" id="installBtn">Install App</button>
    </div>
  </header>

  <div class="install-overlay" id="installOverlay">
    <div class="install-card">
      <button class="install-close" id="installClose" aria-label="Close">✕</button>
      <h2>Add to Home Screen</h2>
      <div id="installSteps"></div>
      <button class="btn-primary install-got-it" id="installGotIt">Got it</button>
    </div>
  </div>

  <!-- ============ LEFT: FORM ============ -->
  <div>

    <div class="panel">
      <h2>Property</h2>
      <label for="condoSelect">Condominium</label>
      <select id="condoSelect">
        <option value="jazz">Jazz Residences</option>
        <option value="air">Air Residences</option>
      </select>
    </div>

    <div class="panel">
      <h2>Unit Owner / Authorized Representative</h2>

      <div class="owner-select-row">
        <div style="flex:1">
          <label for="ownerSelect">Load a saved owner</label>
          <select id="ownerSelect">
            <option value="">— New owner —</option>
          </select>
        </div>
        <button class="btn-ghost" id="deleteOwnerBtn" title="Delete this saved owner">Delete</button>
      </div>

      <div class="row">
        <div>
          <label for="ownerName">Owner / representative name (printed)</label>
          <input type="text" id="ownerName" placeholder="Full Name">
        </div>
      </div>

      <label>Signature</label>
      <div id="savedTag" style="display:none" class="saved-tag">✓ Using saved signature</div>
      <div class="sig-wrap">
        <canvas id="ownerSigPad" class="sig-pad"></canvas>
        <span class="sig-hint">Draw with mouse or finger</span>
      </div>
      <div class="sig-actions">
        <button class="btn-secondary" id="clearOwnerSig">Clear</button>
        <button class="btn-green" id="saveOwnerSig">Save signature for this owner</button>
      </div>
      <div class="status-msg" id="ownerStatus"></div>
    </div>

    <div class="panel">
      <h2>Unit &amp; Period</h2>
      <div class="row unit-period-row">
        <div>
          <label for="tower">Tower</label>
          <input type="text" id="tower" placeholder="">
        </div>
        <div>
          <label for="unit">Unit</label>
          <input type="text" id="unit" placeholder="">
        </div>
        <div>
          <label for="givenDate">Letter date</label>
          <input type="date" id="givenDate">
        </div>
      </div>
      <div class="row two">
        <div>
          <label for="dateFrom">Stay period — from</label>
          <input type="date" id="dateFrom">
        </div>
        <div>
          <label for="dateTo">Stay period — to</label>
          <input type="date" id="dateTo">
        </div>
      </div>
      <div class="status-msg" id="periodDateStatus"></div>
    </div>

    <div class="panel">
      <h2>Guests</h2>
      <table class="guest-table">
        <thead>
          <tr>
            <th style="width:34%">Name</th>
            <th style="width:28%">Proof of ID</th>
            <th style="width:28%">Relationship</th>
            <th style="width:10%"></th>
          </tr>
        </thead>
        <tbody id="guestBody"></tbody>
      </table>
      <button class="btn-secondary add-guest" id="addGuest">+ Add guest</button>
      <div class="id-upload-row">
        <label for="idUpload">Scan ID(s) to add guests</label>
        <input type="file" id="idUpload" accept="image/*" multiple>
        <div class="status-msg" id="idScanStatus"></div>
      </div>
    </div>

    <div class="panel">
      <div class="actions-bar">
        <button class="btn-primary" id="downloadPdf">Download PDF</button>
        <button class="btn-secondary" id="printLetter">Open PDF to Print</button>
      </div>
      <div class="status-msg" id="genStatus"></div>
      <div id="pdfFallback"></div>
    </div>
  </div>

  <!-- ============ RIGHT: PREVIEW ============ -->
  <div class="preview-shell" id="previewShell">
   <div id="letterFitWrap">
    <div id="letter">
      <div id="letterContent"></div>
    </div>
   </div>
  </div>

</div>

<script>
/* ---------------- state ---------------- */
let guestIdCounter = 0;
let guests = []; // {id, name, idType, relationship}
let ownerSigDataUrl = null;
let ownersIndex = []; // list of {name}
const ID_TYPES = ["Gov't ID", "Passport", "Driver's License", "Company ID", "Student ID", "Other"];

/* ---------------- condo letter templates ---------------- */
/* Each condo's full letter body lives in its own file (jazz.html /
   air.html) instead of being embedded inline here, so the two templates
   stay easy to find and edit on their own. Fetched once each and cached. */
const CONDO_FILES = { jazz: 'jazz.html', air: 'air.html' };
const CONDO_LABELS = { jazz: 'Jazz Residences', air: 'Air Residences' };
const condoBodyCache = {};
async function loadCondoBody(condo){
  if(!condoBodyCache[condo]){
    const file = CONDO_FILES[condo] || CONDO_FILES.jazz;
    const resp = await fetch(file);
    condoBodyCache[condo] = await resp.text();
  }
  return condoBodyCache[condo];
}
async function applyCondoBody(){
  const condo = document.getElementById('condoSelect').value;
  document.getElementById('letterContent').innerHTML = await loadCondoBody(condo);
  document.getElementById('pageTitle').textContent = 'Authorization Letter — ' + (CONDO_LABELS[condo] || CONDO_LABELS.jazz);
  renderPreview();
}
document.getElementById('condoSelect').addEventListener('change', applyCondoBody);

/* ---------------- signature pad ---------------- */
const canvas = document.getElementById('ownerSigPad');
const ctx = canvas.getContext('2d');
let drawing = false, hasDrawn = false;

function resizeCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if(rect.width < 5){
    // Layout not ready yet (can happen right at page load) — try again shortly.
    setTimeout(resizeCanvas, 100);
    return;
  }
  const prevImg = hasDrawn ? canvas.toDataURL() : null;
  canvas.width = rect.width * ratio;
  canvas.height = 150 * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#152a4d';
  if(prevImg){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, 150);
    img.src = prevImg;
  }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('load', resizeCanvas);
setTimeout(resizeCanvas, 50);

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}
function startDraw(e){
  e.preventDefault();
  drawing = true;
  hasDrawn = true;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  markSigDirty();
}
function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}
function endDraw(){
  if(drawing){ drawing = false; renderPreview(); }
}
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw);

function markSigDirty(){
  document.getElementById('savedTag').style.display = 'none';
  ownerSigDataUrl = null;
}

document.getElementById('clearOwnerSig').addEventListener('click', () => {
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, 150);
  hasDrawn = false;
  markSigDirty();
  renderPreview();
});

/* ---------------- storage helpers ---------------- */
function slug(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// window.storage only exists inside Claude's artifact preview. When this
// file is exported and opened directly in a browser, it's undefined — so
// we fall back to the browser's own localStorage instead, keeping the
// "save signature for reuse" feature working either way.
const storageAPI = {
  async get(key){
    if(window.storage){
      try{ return await window.storage.get(key, false); }
      catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem('authletter:' + key);
      return raw ? { key, value: raw } : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage){
      try{ return await window.storage.set(key, value, false); }
      catch(e){ return null; }
    }
    try{
      localStorage.setItem('authletter:' + key, value);
      return { key, value };
    }catch(e){ return null; }
  },
  async delete(key){
    if(window.storage){
      try{ return await window.storage.delete(key, false); }
      catch(e){ return null; }
    }
    try{
      localStorage.removeItem('authletter:' + key);
      return { key, deleted: true };
    }catch(e){ return null; }
  }
};

async function loadOwnersIndex(){
  const res = await storageAPI.get('owners-index');
  try{
    ownersIndex = res ? JSON.parse(res.value) : [];
  }catch(e){
    ownersIndex = [];
  }
  populateOwnerSelect();
}

function populateOwnerSelect(){
  const sel = document.getElementById('ownerSelect');
  sel.innerHTML = '<option value="">— New owner —</option>';
  ownersIndex.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.slug;
    opt.textContent = o.name;
    sel.appendChild(opt);
  });
}

async function saveOwnerSignature(){
  const name = document.getElementById('ownerName').value.trim();
  const statusEl = document.getElementById('ownerStatus');
  statusEl.classList.remove('error');
  if(!name){
    statusEl.textContent = 'Enter the owner\'s name first.';
    statusEl.classList.add('error');
    return;
  }
  if(!hasDrawn){
    statusEl.textContent = 'Draw a signature first.';
    statusEl.classList.add('error');
    return;
  }
  const dataUrl = canvas.toDataURL('image/png');
  const key = 'owner:' + slug(name);
  const result = await storageAPI.set(key, JSON.stringify({ name, signature: dataUrl }));
  if(result){
    if(!ownersIndex.find(o => o.slug === slug(name))){
      ownersIndex.push({ slug: slug(name), name });
      await storageAPI.set('owners-index', JSON.stringify(ownersIndex));
    }
    ownerSigDataUrl = dataUrl;
    populateOwnerSelect();
    document.getElementById('ownerSelect').value = slug(name);
    document.getElementById('savedTag').style.display = 'inline-flex';
    document.getElementById('savedTag').textContent = '✓ Signature saved for ' + name;
    statusEl.textContent = 'Saved. This owner will be available next time.';
  } else {
    statusEl.textContent = 'Could not save — storage unavailable here.';
    statusEl.classList.add('error');
  }
  renderPreview();
}

async function loadOwner(slugVal){
  const statusEl = document.getElementById('ownerStatus');
  statusEl.textContent = '';
  statusEl.classList.remove('error');
  if(!slugVal){
    document.getElementById('ownerName').value = '';
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, 150);
    hasDrawn = false;
    ownerSigDataUrl = null;
    document.getElementById('savedTag').style.display = 'none';
    renderPreview();
    return;
  }
  const res = await storageAPI.get('owner:' + slugVal);
  if(!res){
    statusEl.textContent = 'Could not load that owner.';
    statusEl.classList.add('error');
    return;
  }
  try{
    const data = JSON.parse(res.value);
    document.getElementById('ownerName').value = data.name;
    ownerSigDataUrl = data.signature;
    const img = new Image();
    img.onload = () => {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, 150);
      ctx.drawImage(img, 0, 0, rect.width, 150);
      hasDrawn = true;
      renderPreview();
    };
    img.src = data.signature;
    document.getElementById('savedTag').style.display = 'inline-flex';
    document.getElementById('savedTag').textContent = '✓ Using saved signature';
  }catch(e){
    statusEl.textContent = 'Could not load that owner.';
    statusEl.classList.add('error');
  }
}

document.getElementById('ownerSelect').addEventListener('change', (e) => loadOwner(e.target.value));
document.getElementById('saveOwnerSig').addEventListener('click', saveOwnerSignature);
document.getElementById('ownerName').addEventListener('input', () => {
  document.getElementById('savedTag').style.display = 'none';
});

document.getElementById('deleteOwnerBtn').addEventListener('click', async () => {
  const sel = document.getElementById('ownerSelect');
  const slugVal = sel.value;
  if(!slugVal) return;
  if(!confirm('Delete this saved owner and their signature?')) return;
  await storageAPI.delete('owner:' + slugVal);
  ownersIndex = ownersIndex.filter(o => o.slug !== slugVal);
  await storageAPI.set('owners-index', JSON.stringify(ownersIndex));
  populateOwnerSelect();
  sel.value = '';
  loadOwner('');
});

/* ---------------- guests ---------------- */
function addGuestRow(prefill){
  const id = guestIdCounter++;
  guests.push({ id, name: prefill?.name || '', idType: prefill?.idType || ID_TYPES[0], relationship: prefill?.relationship || 'Guest' });
  renderGuestForm();
  renderPreview();
}
function fillOrAddGuest(prefill){
  const empty = guests.find(g => !g.name.trim());
  if(empty){
    empty.name = prefill?.name || '';
    empty.idType = prefill?.idType || ID_TYPES[0];
    empty.relationship = prefill?.relationship || 'Guest';
    renderGuestForm();
    renderPreview();
  } else {
    addGuestRow(prefill);
  }
}
function removeGuestRow(id){
  guests = guests.filter(g => g.id !== id);
  renderGuestForm();
  renderPreview();
}
function renderGuestForm(){
  const body = document.getElementById('guestBody');
  body.innerHTML = '';
  guests.forEach(g => {
    const tr = document.createElement('tr');
    tr.className = 'guest-row';
    tr.innerHTML = `
      <td><input type="text" data-field="name" data-id="${g.id}" value="${escapeAttr(g.name)}" placeholder="Full name"></td>
      <td>
        <select data-field="idType" data-id="${g.id}">
          ${ID_TYPES.map(t => `<option value="${t}" ${t===g.idType?'selected':''}>${t}</option>`).join('')}
        </select>
      </td>
      <td><input type="text" data-field="relationship" data-id="${g.id}" value="${escapeAttr(g.relationship)}" placeholder="Guest / Family / Tenant"></td>
      <td><button class="icon-btn" data-remove="${g.id}" title="Remove">✕</button></td>
    `;
    body.appendChild(tr);
  });
  body.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', (e) => {
      const g = guests.find(x => x.id == e.target.dataset.id);
      if(g){ g[e.target.dataset.field] = e.target.value; renderPreview(); }
    });
  });
  body.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => removeGuestRow(Number(btn.dataset.remove)));
  });
}
function escapeAttr(s){ return (s||'').replace(/"/g, '&quot;'); }
document.getElementById('addGuest').addEventListener('click', () => addGuestRow());

/* ---------------- ID scan -> guest name ----------------
   Best-effort OCR via Tesseract.js (runs entirely in the browser — the
   image never leaves the device). ID layouts vary too much to parse
   reliably, so this only produces a starting guess; the name field
   stays a normal editable input either way. */
const ID_LINE_BLACKLIST = [
  'republic', 'philippines', 'pilipinas', 'republika', 'department', 'transportation',
  'license', 'lisensya', 'passport', 'passaporte', 'government', 'pamahalaan',
  'identification', 'identity', 'card', 'karta', 'signature', 'lagda',
  'address', 'tirahan', 'birth', 'kapanganakan', 'sex', 'kasarian', 'nationality',
  'nasyonalidad', 'blood type', 'weight', 'height', 'expiration', 'expiry',
  'date issued', 'agency', 'authority', 'ssn', 'sss', 'tin', 'philhealth',
  'pag-ibig', 'gsis', 'student', 'employee', 'company', 'corp', 'university',
  'college', 'school', 'restrictions', 'conditions', 'class', 'no.', 'number'
];
const ID_LABEL_PATTERNS = [
  /(?:full\s*name|name)\s*[:\-]\s*([A-Za-z ,.'-]{4,60})/i,
];
function guessNameFromOcrText(text){
  const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for(const pattern of ID_LABEL_PATTERNS){
    for(const line of rawLines){
      const m = line.match(pattern);
      if(m && m[1].trim().length >= 4) return titleCase(m[1].trim());
    }
  }
  let best = null;
  for(const line of rawLines){
    const lower = line.toLowerCase();
    if(ID_LINE_BLACKLIST.some(w => lower.includes(w))) continue;
    if(!/^[A-Za-z ,.'-]{4,40}$/.test(line)) continue;
    const words = line.split(/\s+/).filter(Boolean);
    if(words.length < 2 || words.length > 5) continue;
    const letters = line.replace(/[^A-Za-z]/g, '');
    if(letters.length < 4) continue;
    const upperRatio = (letters.match(/[A-Z]/g) || []).length / letters.length;
    if(upperRatio < 0.7) continue; // ID names are typically printed in caps
    if(!best || line.length > best.length) best = line;
  }
  return best ? titleCase(best) : '';
}
function titleCase(s){
  return s.toLowerCase().replace(/(^|[\s,.'-])([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
}
function guessIdTypeFromOcrText(text){
  const lower = text.toLowerCase();
  if(lower.includes('passport')) return 'Passport';
  if(lower.includes('driver')) return "Driver's License";
  if(lower.includes('student')) return 'Student ID';
  if(lower.includes('employee') || lower.includes('company')) return 'Company ID';
  return "Gov't ID";
}
let idScanWorker = null;
async function getIdScanWorker(){
  if(!idScanWorker){
    idScanWorker = await Tesseract.createWorker('eng');
  }
  return idScanWorker;
}
async function scanIdFiles(files){
  const statusEl = document.getElementById('idScanStatus');
  statusEl.classList.remove('error');
  const input = document.getElementById('idUpload');
  input.disabled = true;
  let added = 0;
  try{
    const worker = await getIdScanWorker();
    for(let i = 0; i < files.length; i++){
      statusEl.textContent = `Scanning ID ${i + 1} of ${files.length}…`;
      try{
        const { data } = await worker.recognize(files[i]);
        const name = guessNameFromOcrText(data.text || '');
        const idType = guessIdTypeFromOcrText(data.text || '');
        fillOrAddGuest({ name, idType, relationship: 'Guest' });
        added++;
      }catch(e){
        console.error('ID scan failed for', files[i].name, e);
        fillOrAddGuest({ name: '', idType: ID_TYPES[0], relationship: 'Guest' });
      }
    }
    statusEl.textContent = added === files.length
      ? `Added ${added} guest${added === 1 ? '' : 's'} from scanned ID${files.length === 1 ? '' : 's'} — check the name field${added === 1 ? '' : 's'}.`
      : `Added ${added} of ${files.length} guests — some scans failed, check names.`;
  }catch(e){
    console.error('ID scan setup failed', e);
    statusEl.textContent = 'Could not scan ID(s). Add the guest manually.';
    statusEl.classList.add('error');
  }
  input.disabled = false;
  input.value = '';
}
document.getElementById('idUpload').addEventListener('change', (e) => {
  const files = Array.from(e.target.files || []);
  if(files.length) scanIdFiles(files);
});

/* ---------------- preview rendering ---------------- */
function fmtDateShort(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function renderPreview(){
  document.getElementById('pv-tower').textContent = document.getElementById('tower').value || '\u00A0';
  document.getElementById('pv-unit').textContent = document.getElementById('unit').value || '\u00A0';
  document.getElementById('pv-from').textContent = fmtDateShort(document.getElementById('dateFrom').value) || '\u00A0';
  document.getElementById('pv-to').textContent = fmtDateShort(document.getElementById('dateTo').value) || '\u00A0';

  const given = document.getElementById('givenDate').value;
  if(given){
    const d = new Date(given + 'T00:00:00');
    document.getElementById('pv-day').textContent = d.getDate();
    document.getElementById('pv-month').textContent = d.toLocaleDateString('en-US', { month: 'short' });
    document.getElementById('pv-year').textContent = String(d.getFullYear()).slice(-2);
  } else {
    document.getElementById('pv-day').textContent = '\u00A0';
    document.getElementById('pv-month').textContent = '\u00A0';
    document.getElementById('pv-year').textContent = '\u00A0';
  }

  const tbody = document.getElementById('pv-guests');
  tbody.innerHTML = '';
  const rowsToShow = Math.max(guests.length, 4);
  for(let i = 0; i < rowsToShow; i++){
    const g = guests[i];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="gname">${g ? escapeHtml(g.name) : '&nbsp;'}</td>
      <td></td>
      <td class="gid">${g && g.name ? escapeHtml(g.idType) : '&nbsp;'}</td>
      <td class="grel">${g && g.name ? escapeHtml(g.relationship) : '&nbsp;'}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById('pv-owner-name').textContent = document.getElementById('ownerName').value || '\u00A0';
  const sigImgWrap = document.getElementById('pv-sig-img');
  sigImgWrap.innerHTML = '';
  const liveSig = hasDrawn ? canvas.toDataURL('image/png') : null;
  if(liveSig){
    const img = document.createElement('img');
    img.src = liveSig;
    sigImgWrap.appendChild(img);
  }

  fitLetterToViewport();
}

/* Shrink the fixed-width letter to fit narrow phone screens instead of
   forcing horizontal scrolling. Uses a CSS transform on #letter itself,
   sized by an outer wrapper so no extra blank space is left over. The
   PDF export always resets this to 1:1 first, so print/download quality
   is unaffected. */
function fitLetterToViewport(){
  const shell = document.getElementById('previewShell');
  const wrap = document.getElementById('letterFitWrap');
  const letterEl = document.getElementById('letter');
  if(!shell || !wrap || !letterEl) return;
  const available = shell.clientWidth - 40; // minus shell's own padding
  const naturalWidth = 816;
  const naturalHeight = letterEl.offsetHeight; // unaffected by transform on itself
  let scale = available < naturalWidth ? Math.max(0.28, available / naturalWidth) : 1;
  letterEl.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  wrap.style.width = Math.round(naturalWidth * scale) + 'px';
  wrap.style.height = Math.round(naturalHeight * scale) + 'px';
}
window.addEventListener('resize', fitLetterToViewport);

function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

['tower','unit','dateFrom','dateTo','givenDate','ownerName'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderPreview);
});

/* ---------------- stay-period date constraints ----------------
   "from" can't be before today; "to" can't be before "from" (same day
   is fine for both). The min attribute both blocks earlier picks in the
   native picker and is re-validated on change in case a value was typed
   or left over from before the constraint tightened. */
(function setupDateConstraints(){
  const dateFrom = document.getElementById('dateFrom');
  const dateTo = document.getElementById('dateTo');
  const statusEl = document.getElementById('periodDateStatus');
  const todayStr = new Date().toISOString().slice(0,10);
  dateFrom.min = todayStr;

  function warn(message){
    statusEl.textContent = message;
    statusEl.classList.add('error');
  }
  function clearWarning(){
    statusEl.textContent = '';
    statusEl.classList.remove('error');
  }

  function syncToMin(){
    dateTo.min = dateFrom.value || todayStr;
    if(dateTo.value && dateTo.value < dateTo.min){
      dateTo.value = '';
      refreshDateHasValue(dateTo);
      renderPreview();
      warn('"Stay period — to" can’t be before "from" — please pick again.');
    }
  }
  syncToMin();
  dateFrom.addEventListener('change', () => {
    if(dateFrom.value && dateFrom.value < todayStr){
      dateFrom.value = '';
      refreshDateHasValue(dateFrom);
      warn('"Stay period — from" can’t be before today — please pick again.');
    } else {
      clearWarning();
    }
    syncToMin();
  });
  dateTo.addEventListener('change', () => {
    if(dateTo.value && dateTo.value < dateTo.min){
      dateTo.value = '';
      refreshDateHasValue(dateTo);
      renderPreview();
      warn('"Stay period — to" can’t be before "from" — please pick again.');
    } else {
      clearWarning();
    }
  });
})();

/* ---------------- PDF export / print ---------------- */
let lastPdfUrl = null; // revoke previous blob url before making a new one

async function buildPdfBlob(){
  const node = document.getElementById('letter');
  // On phones the letter is visually shrunk (CSS transform) to fit the
  // screen. Reset that before capturing so the PDF is always rendered at
  // full, sharp resolution — using offsetWidth/Height (unaffected by the
  // element's own transform) rather than getBoundingClientRect (which
  // would report the shrunk size).
  const prevTransform = node.style.transform;
  node.style.transform = 'none';
  void node.offsetHeight; // force layout to settle before measuring/capturing
  const nodeSize = { width: node.offsetWidth, height: node.offsetHeight };
  const canvasImg = await html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
  node.style.transform = prevTransform;
  const imgData = canvasImg.toDataURL('image/jpeg', 0.95);
  const { jsPDF } = window.jspdf;

  // Fixed US Legal page (8.5in x 14in), matching the original paper form.
  // If the letter's actual content is taller than one Legal page (e.g. a
  // lot of guests were added), scale the whole image down to fit rather
  // than cropping or splitting across pages.
  const pxToPt = 72 / 96;
  const LEGAL_WIDTH_PT = 612;
  const LEGAL_HEIGHT_PT = 1008;
  const contentWidthPt = nodeSize.width * pxToPt;
  const contentHeightPt = nodeSize.height * pxToPt;
  const fitScale = Math.min(LEGAL_WIDTH_PT / contentWidthPt, LEGAL_HEIGHT_PT / contentHeightPt, 1);
  const drawWidthPt = contentWidthPt * fitScale;
  const drawHeightPt = contentHeightPt * fitScale;
  const offsetXPt = (LEGAL_WIDTH_PT - drawWidthPt) / 2;
  const pdf = new jsPDF({ unit: 'pt', format: [LEGAL_WIDTH_PT, LEGAL_HEIGHT_PT] });
  pdf.addImage(imgData, 'JPEG', offsetXPt, 0, drawWidthPt, drawHeightPt);

  const unit = document.getElementById('unit').value || 'unit';
  const ownerN = document.getElementById('ownerName').value || 'owner';
  const condoLabel = document.getElementById('condoSelect').selectedOptions[0].textContent.replace(/\s+/g, '');
  const filename = `Authorization-Letter-${condoLabel}-${unit}-${slug(ownerN)}.pdf`;
  const blob = pdf.output('blob');
  if(lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
  const url = URL.createObjectURL(blob);
  lastPdfUrl = url;
  return { url, filename, blob };
}

function showFallbackLink(url, filename, label){
  const wrap = document.getElementById('pdfFallback');
  wrap.innerHTML = '';
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = label;
  a.className = 'pdf-fallback-link';
  wrap.appendChild(a);
}

async function downloadPdf(){
  const statusEl = document.getElementById('genStatus');
  statusEl.classList.remove('error');
  statusEl.textContent = 'Rendering PDF…';
  const btn = document.getElementById('downloadPdf');
  btn.disabled = true;
  try{
    const { url, filename, blob } = await buildPdfBlob();

    // On iOS/Android, an <a download> on a blob: URL is often silently
    // ignored — the browser just opens the PDF in its viewer instead of
    // saving it, which looks identical to the "Open PDF to Print" button.
    // The Web Share API's file-sharing lets the user pick "Save to Files"
    // (or similar) from the native share sheet, which is an actual save.
    // Desktop browsers (including macOS Safari, which also implements
    // navigator.share) already download blob: links directly and correctly,
    // so only take the share-sheet detour on actual mobile devices.
    let handled = false;
    const isMobile = detectPlatform() !== 'desktop';
    try{
      const file = new File([blob], filename, { type: 'application/pdf' });
      if(isMobile && navigator.canShare && navigator.canShare({ files: [file] })){
        // Sharing "title" alongside "files" makes iOS Safari treat it as a
        // second, separate shareable text item — "Save to Files" then saves
        // both the PDF and a stray .txt containing that title string. The
        // filename is already on the File object itself, so omit title/text.
        await navigator.share({ files: [file] });
        statusEl.textContent = 'Choose "Save to Files" (or similar) from the share menu to download.';
        handled = true;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === 'AbortError'){
        statusEl.textContent = '';
        handled = true;
      } else {
        console.warn('Share failed, falling back to direct download link', shareErr);
      }
    }
    if(handled){
      btn.disabled = false;
      return;
    }

    // Desktop (and any browser without file sharing) path: attempt an
    // automatic download, and always leave a real, tappable link behind
    // as a guaranteed fallback.
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showFallbackLink(url, filename, '✓ PDF ready — tap here to save: ' + filename);
    statusEl.textContent = 'If the download didn\u2019t start automatically, tap the link below.';
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Could not generate PDF.';
    statusEl.classList.add('error');
  }
  btn.disabled = false;
}

async function printLetter(){
  const statusEl = document.getElementById('genStatus');
  statusEl.classList.remove('error');
  statusEl.textContent = 'Preparing PDF…';
  const btn = document.getElementById('printLetter');
  btn.disabled = true;
  // Open the tab synchronously, before the await, so the browser still
  // treats it as a direct result of the tap (otherwise mobile browsers
  // block it as a popup once we're past an await).
  let win = null;
  try{ win = window.open('', '_blank'); }catch(e){ win = null; }
  try{
    const { url, filename } = await buildPdfBlob();
    if(win){
      win.location.href = url;
      statusEl.textContent = 'Opened in a new tab — use its Print or Share icon.';
    } else {
      statusEl.textContent = 'Tap the link below to open the PDF, then print or share from there.';
    }
    showFallbackLink(url, filename, 'Open PDF to print / share');
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Could not generate PDF.';
    statusEl.classList.add('error');
    if(win) win.close();
  }
  btn.disabled = false;
}

document.getElementById('downloadPdf').addEventListener('click', downloadPdf);
document.getElementById('printLetter').addEventListener('click', printLetter);

function refreshDateHasValue(input){
  input.classList.toggle('has-value', !!input.value);
}
document.querySelectorAll('input[type=date]').forEach(input => {
  refreshDateHasValue(input);
  input.addEventListener('input', () => refreshDateHasValue(input));
  input.addEventListener('change', () => refreshDateHasValue(input));
});

/* ---------------- "Add to Home Screen" instructions ---------------- */
function detectPlatform(){
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(isIOS) return 'ios';
  if(/Android/.test(ua)) return 'android';
  return 'desktop';
}
function installStepsHtml(){
  const platform = detectPlatform();
  if(platform === 'ios'){
    return `<ol>
      <li>Tap the <strong>Share</strong> icon (square with an arrow pointing up) in Safari's toolbar.</li>
      <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
      <li>Tap <strong>Add</strong> in the top-right corner.</li>
    </ol>`;
  }
  if(platform === 'android'){
    return `<ol>
      <li>Tap the <strong>⋮</strong> menu (top-right of Chrome).</li>
      <li>Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong>).</li>
      <li>Confirm by tapping <strong>Add</strong> or <strong>Install</strong>.</li>
    </ol>`;
  }
  return `<p>Look for an install icon in your browser's address bar, or open the browser menu and choose <strong>Install</strong> / <strong>Add to Home screen</strong>.</p>`;
}
const installOverlay = document.getElementById('installOverlay');
document.getElementById('installBtn').addEventListener('click', () => {
  document.getElementById('installSteps').innerHTML = installStepsHtml();
  installOverlay.classList.add('open');
});
document.getElementById('installClose').addEventListener('click', () => installOverlay.classList.remove('open'));
document.getElementById('installGotIt').addEventListener('click', () => installOverlay.classList.remove('open'));
installOverlay.addEventListener('click', (e) => {
  if(e.target === installOverlay) installOverlay.classList.remove('open');
});
</script>
